name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r dashboard/requirements.lock

      - name: Run Python tests
        run: python -m pytest dashboard/tests -v

  r-tests:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Create R library directory
        run: mkdir -p "$R_LIBS_USER"

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.rlib
          key: ${{ runner.os }}-R4.5-${{ hashFiles('scripts/ci/install_deps.R') }}

      - name: Install R dependencies
        run: Rscript scripts/ci/install_deps.R --dev

      - name: Verify pactatrisk package loads
        run: |
          Rscript -e "devtools::load_all('.'); cat('pactatrisk loads OK\n')"

      # Wave 4 PHASE-04. devtools::load_all() above loads every function in R/
      # regardless of NAMESPACE, so it cannot notice when NAMESPACE goes stale.
      # It had: 20 Wave 3 functions carried #' @export and appeared in no
      # NAMESPACE entry, so library(pactatrisk) exposed none of the PCAF layer,
      # the target registry, the SLL screen, the run history or the i18n engine.
      - name: NAMESPACE is up to date with roxygen
        run: |
          cp NAMESPACE /tmp/NAMESPACE.before
          Rscript -e "roxygen2::roxygenise()"
          diff -u /tmp/NAMESPACE.before NAMESPACE

      - name: Run R tests
        run: Rscript -e "testthat::test_dir('tests/testthat')"

      - name: Cross-artifact invariants
        run: Rscript tools/verify_refactor.R --invariants

  sdb-engagement:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Create R library directory
        run: mkdir -p "$R_LIBS_USER"

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.rlib
          key: ${{ runner.os }}-R4.5-${{ hashFiles('scripts/ci/install_deps.R') }}

      - name: Install R dependencies
        run: Rscript scripts/ci/install_deps.R --dev

      - name: Run SDB engagement end-to-end
        run: Rscript scripts/run_engagement.R --config engagements/sdb-rehearsal/engagement_config.json

      - name: SDB golden tests
        run: RUN_SDB_ENGAGEMENT=1 Rscript -e "testthat::test_file('tests/testthat/test_sdb_engagement.R')"

      - name: Assert no cross-contamination
        run: |
          if [ -n "$(git status --porcelain synthesis_output output dashboard/data reports)" ]; then
            echo "SDB engagement run left uncommitted changes outside engagements/sdb-rehearsal/:"
            git status --porcelain synthesis_output output dashboard/data reports
            exit 1
          fi

  byte-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Create R library directory
        run: mkdir -p "$R_LIBS_USER"

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.rlib
          key: ${{ runner.os }}-R4.5-${{ hashFiles('scripts/ci/install_deps.R') }}

      - name: Install R dependencies
        run: Rscript scripts/ci/install_deps.R --dev

      - name: Byte-identity acceptance check
        run: Rscript tools/verify_refactor.R
