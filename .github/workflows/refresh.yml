name: Refresh pipeline data

on:
  workflow_dispatch:
    inputs:
      allow_drift:
        description: "Skip the byte-identity drift gate (use only for an intentional, reviewed refreeze)"
        required: false
        default: "false"
        type: boolean
  schedule:
    # Every Monday 02:00 UTC.
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install system dependencies for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libgdal-dev libudunits2-dev libuv1-dev

      - name: Create R library directory
        run: mkdir -p "$R_LIBS_USER"

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.rlib
          key: ${{ runner.os }}-R4.5-${{ hashFiles('scripts/ci/install_deps.R') }}

      - name: Install R dependencies
        run: Rscript scripts/ci/install_deps.R --dev

      - name: Run pipeline refresh
        run: Rscript scripts/pipeline_refresh.R

      - name: Regression-test refreshed outputs
        run: Rscript -e "testthat::test_dir('tests/testthat')"

      - name: Cross-artifact invariants
        run: Rscript tools/verify_refactor.R --invariants

      # Byte-identity drift gate: fails the run if the refresh produced any
      # genuine numeric drift, so the weekly auto-commit below can never
      # silently republish a regression. A scheduled run always enforces this
      # gate because github.event.inputs is empty for the `schedule` trigger,
      # not just for the default `false`. To land an intentional, reviewed
      # refreeze, re-run this workflow manually with allow_drift: true.
      - name: Byte-identity drift gate
        if: github.event.inputs.allow_drift != 'true'
        run: Rscript tools/verify_refactor.R --skip-refresh

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data synthesis_output reports/pipeline_refresh_audit.html reports/refresh_audit_metrics.json history
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: automated pipeline refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report failure
        if: failure()
        run: echo "::error::Weekly refresh failed \u2014 the public snapshot was NOT updated. See the failing step above."
